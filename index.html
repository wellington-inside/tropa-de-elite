<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tropa de Elite em Outubro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&display=swap">
<style>
/* Identidade única escura do escudo do clã (preto, ouro, esmeralda). Layout: brasão + placar no topo, pódio, ranking com linha de corte do top 15, histórico guerra a guerra */
:root{
  --bg:#0d0b08; --panel:#17140f; --panel2:#1f1b14; --line:#2f2920; --fg:#f3ebda; --muted:#a69a83;
  --gold:#e8b53e; --gold2:#f6d77a; --gold-soft:#3a2d10; --emer:#3ee09a; --emer-soft:#10301f;
  --silver:#c9d1db; --bronze:#d08a52;
  --ok:#5fd79a; --ok-soft:#14301f; --warn:#f0ad5c; --warn-soft:#382711; --bad:#ff8378; --bad-soft:#3b1a17;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 50% -160px,#33270f 0%,transparent 70%) var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:32px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--emer);outline-offset:2px}
/* topo */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.crest{width:120px;height:120px;filter:drop-shadow(0 8px 26px rgba(232,181,62,.3))}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.crest{width:96px;height:96px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,58px);line-height:.95;margin:4px 0 8px;letter-spacing:.5px;text-wrap:balance}
h1 span{background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#a8741a);-webkit-background-clip:text;background-clip:text;color:transparent}
.upd{font-size:12px;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.3px}
.sec-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
section{display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:fit-content}
@media (max-width:560px){.tabs{margin:0 auto}}
.tabs button{font-weight:800;font-size:14px;padding:9px 18px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#15120e}
/* placar */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.stat b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--emer),#1fa36b)}
/* pódio */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
@media (max-width:640px){.podium{grid-template-columns:1fr}.podium .p1{order:-1}}
.pod{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.pod.p1{--c:linear-gradient(90deg,var(--gold2),var(--gold));padding-block:26px 20px;background:linear-gradient(180deg,#2a2110,var(--panel) 70%)}
.pod.p2{--c:var(--silver)} .pod.p3{--c:var(--bronze)}
.pod .pos{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.06em}
.pod.p1 .pos{color:var(--gold)}
.pod .nm{font-weight:900;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.pod.p1 .nm{font-size:23px}
.pod .big{font-family:var(--display);font-size:34px;line-height:1}
.pod.p1 .big{font-size:44px;color:var(--gold)}
.pod .det{font-size:12px;color:var(--muted)}
/* ranking */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.sort{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.sort button{font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.sort button[aria-pressed="true"]{border-color:var(--emer);color:var(--emer)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;background:var(--panel2)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(232,181,62,.04)}
td.name{font-weight:800}
td.rk{font-family:var(--display);font-size:16px;color:var(--muted);width:44px}
tr.top td.rk{color:var(--gold)}
tr.cut td{border-bottom:2px dashed var(--gold)}
tr.cutlabel td{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:5px}
.zone{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
.zone.liga{background:var(--emer-soft);color:var(--emer)}
.zone.union{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.star{color:var(--gold)}
.chips{display:inline-flex;gap:4px}
.chip{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:5px;font-size:12px;font-weight:900;background:var(--panel2);border:1px solid var(--line)}
.chip.s6{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.chip.s5,.chip.s4{color:var(--fg)}
.chip.low{color:var(--warn)}
.chip.miss{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.chip.na{color:var(--muted);opacity:.5}
.bar{display:inline-block;vertical-align:middle;width:56px;height:6px;border-radius:3px;background:var(--line);margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--emer)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}
/* histórico */
.wars{display:flex;flex-direction:column;gap:12px}
.war{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.war summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.war summary::-webkit-details-marker{display:none}
.war summary:focus-visible{outline:2px solid var(--emer);outline-offset:-2px}
.wnum{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold);font-family:var(--display);color:var(--gold);line-height:1;text-align:center}
.wnum small{display:block;font-family:var(--body);font-size:9px;font-weight:900;letter-spacing:.1em}
.wnum b{font-size:22px;font-weight:400}
.wmeta{min-width:0;display:flex;flex-direction:column;gap:3px}
.wopp{font-weight:900;font-size:17px;overflow-wrap:anywhere}
.wopp span{color:var(--muted);font-weight:600;font-size:13px}
.wtags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.wtags b{color:var(--fg)}
.wright{text-align:right;display:flex;flex-direction:column;align-items:end;gap:4px}
.wscore{font-family:var(--display);font-size:24px;color:var(--gold);line-height:1}
.chev{font-size:12px;color:var(--muted);font-weight:800}
.war[open] .chev::after{content:" ▲"} .war:not([open]) .chev::after{content:" ▼"}
@media (max-width:560px){.war summary{grid-template-columns:auto 1fr}.wright{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.wbody{border-top:1px solid var(--line);padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.hl{grid-template-columns:1fr}}
.hlbox{background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:0}
.hlbox h4{margin:0 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hlbox p{margin:0;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.wbody table{min-width:520px}
.wbody .tbl{border-radius:10px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.box ol,.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.box li{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.box li span:last-child{font-weight:800;white-space:nowrap}
.medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;background:var(--gold-soft);color:var(--gold);margin-right:6px}
footer{color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:18px}
</style>

const CORTE = 15;
const $ = s => document.querySelector(s);
const num = v => v === '' || v == null ? null : Number(v);
const fmt = (v, d=1) => v == null ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataBR = s => { const [y,m,d]=s.split('-'); return `${d}/${m}`; };
$('#upd').textContent = 'Atualizado em ' + DATA.atualizado;

function statusPill(feitos, disp){
  if (disp === 0) return '<span class="pill off">Não escalado</span>';
  const f = disp - feitos;
  if (f === 0) return '<span class="pill ok">Todos</span>';
  if (feitos === 0) return '<span class="pill bad">Não atacou</span>';
  return `<span class="pill warn">Faltou ${f}</span>`;
}
function sortTable(el, rows, render, initial, cmp){
  let key = initial;
  const draw = () => {
    const s = rows.slice().sort((a,b)=> key==='rank' ? cmp(a,b) : ((b[key]??-1)-(a[key]??-1) || cmp(a,b)));
    el.querySelector('tbody').innerHTML = render(s, key);
    el.querySelectorAll('.sort button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===key));
  };
  el.querySelector('.sort').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){key=b.dataset.k;draw();} });
  draw();
}

/* ---------- Guerras ---------- */
(function(){
  const g = DATA.guerras.map(r=>({...r, f:num(r.ataques_feitos)||0, d:num(r.ataques_disponiveis)||0, e:num(r.estrelas)||0, nv:num(r.novas_estrelas)||0, p:num(r.destruicao_pct)||0}));
  const el = $('#view-guerras');
  if (!g.length){ el.innerHTML = '<div class="empty"><strong>Nenhuma guerra registrada ainda</strong>Mande o print da aba Minha equipe na conversa do projeto e ela aparece aqui.</div>'; return; }
  const ids = [...new Set(g.map(r=>r.guerra))].sort((a,b)=>a-b);
  const wars = ids.map(id=>{ const rs=g.filter(r=>r.guerra===id); return {id, data:rs[0].data, opp:rs[0].adversario, rs}; });
  const by = {};
  g.forEach(r=>{
    const p = by[r.jogador] ??= {nome:r.jogador, jogou:0, estrelas:0, novas:0, pct:0, feitos:0, disp:0, porGuerra:{}};
    p.jogou++; p.estrelas+=r.e; p.novas+=r.nv; p.pct+=r.p; p.feitos+=r.f; p.disp+=r.d; p.porGuerra[r.guerra]=r;
  });
  const rows = Object.values(by).map(p=>({...p, media:p.feitos?p.pct/p.feitos:null, perdidos:p.disp-p.feitos}));
  const cmp = (a,b)=> b.estrelas-a.estrelas || b.novas-a.novas || b.pct-a.pct;
  const ranked = rows.slice().sort(cmp);
  const totF = rows.reduce((s,r)=>s+r.feitos,0), totD = rows.reduce((s,r)=>s+r.disp,0);
  const totE = rows.reduce((s,r)=>s+r.estrelas,0);
  const pod = ranked.slice(0,3);
  const podCard = (r,i) => r ? `<div class="pod p${i+1}"><div class="pos">${i+1}º LUGAR</div><div class="nm">${esc(r.nome)}</div><div class="big">${r.estrelas}<span class="star" style="font-size:.6em"> ★</span></div><div class="det">${r.novas} novas · ${fmt(r.media)}% de média · ${r.jogou} de ${ids.length} guerras</div></div>` : '';

  el.innerHTML = `
  <section>
    <div class="stats">
      <div class="stat"><small>Guerras no mês</small><b>${ids.length}</b><em>${ids.length} registradas até agora</em></div>
      <div class="stat"><small>Estrelas da tropa</small><b>${totE}</b><em>${fmt(totE/Math.max(totF,1),2)} por ataque</em></div>
      <div class="stat"><small>Ataques usados</small><b>${totF}/${totD}</b><div class="meter"><i style="width:${100*totF/Math.max(totD,1)}%"></i></div></div>
      <div class="stat"><small>Ataques perdidos</small><b style="color:${totD-totF?'var(--bad)':'var(--ok)'}">${totD-totF}</b><em>${rows.filter(r=>r.perdidos).length} jogadores</em></div>
    </div>
  </section>
  <section>
    <div><h2>Pódio do mês</h2><p class="sec-sub">Estrelas reais somadas. Empate: novas estrelas, depois destruição.</p></div>
    <div class="podium">${podCard(pod[1],1)}${podCard(pod[0],0)}${podCard(pod[2],2)}</div>
  </section>
  <section id="g-tbl">
    <div class="sec-head"><div><h2>Ranking para a Liga</h2><p class="sec-sub">Os ${CORTE} primeiros vão para a Liga. Do ${CORTE+1}º em diante, Liga no Union.</p></div>
      <div class="sort">Ordenar <button data-k="rank">Ranking</button><button data-k="media">Média</button><button data-k="novas">Novas</button></div></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>Jogador</th><th class="n">Estrelas</th><th>Por guerra</th><th class="n">Novas</th><th class="n">Média</th><th class="n">Ataques</th><th>Situação</th></tr></thead><tbody></tbody></table></div>
    <p class="note">Estrelas = estrelas conquistadas em cada ataque, mesmo em base já derrubada. Novas = estrelas que ainda não tinham sido tiradas daquela base; premiam quem ataca cedo e servem de desempate.</p>
  </section>
  <section>
    <div><h2>Histórico das guerras</h2><p class="sec-sub">Toque numa guerra para ver o desempenho de cada jogador.</p></div>
    <div class="wars">${wars.slice().reverse().map(warCard).join('')}</div>
  </section>`;

  sortTable($('#g-tbl'), rows, (s,key)=>s.map((r,i)=>{
    const pos = ranked.indexOf(r)+1;
    const isCut = key==='rank' && i===CORTE-1 && s.length>CORTE;
    const chips = ids.map(id=>{ const w=r.porGuerra[id]; if(!w) return '<span class="chip na" title="Não escalado">–</span>';
      const cls = w.f<w.d ? 'miss' : w.e>=6?'s6':w.e>=4?'s'+w.e:'low';
      return `<span class="chip ${cls}" title="Guerra ${id}: ${w.e} estrelas${w.f<w.d?', faltou '+(w.d-w.f):''}">${w.f<w.d && w.f===0?'✕':w.e}</span>`; }).join('');
    const row = `<tr class="${pos<=3?'top':''} ${isCut?'cut':''}"><td class="rk">${key==='rank'?pos:i+1}</td>
      <td class="name">${esc(r.nome)}<span class="zone ${pos<=CORTE?'liga':'union'}">${pos<=CORTE?'LIGA':'UNION'}</span></td>
      <td class="n"><b>${r.estrelas}</b> <span class="star">★</span></td><td><span class="chips">${chips}</span></td>
      <td class="n">${r.novas}</td>
      <td class="n">${r.media==null?'–':fmt(r.media)+'%<span class="bar"><i style="width:'+r.media+'%"></i></span>'}</td>
      <td class="n">${r.feitos}/${r.disp}</td><td>${statusPill(r.feitos,r.disp)}</td></tr>`;
    return row + (isCut ? `<tr class="cutlabel"><td colspan="8">Linha de corte · Top ${CORTE} vai para a Liga</td></tr>` : '');
  }).join(''), 'rank', cmp);

  function warCard(w){
    const rs = w.rs.slice().sort((a,b)=>b.e-a.e||b.nv-a.nv||b.p-a.p);
    const F=rs.reduce((s,r)=>s+r.f,0), D=rs.reduce((s,r)=>s+r.d,0), E=rs.reduce((s,r)=>s+r.e,0), NV=rs.reduce((s,r)=>s+r.nv,0);
    const perf = rs.filter(r=>r.e>=6 && r.f===r.d).map(r=>esc(r.jogador));
    const falt = rs.filter(r=>r.f<r.d).map(r=>esc(r.jogador)+(r.f===0?' (não atacou)':' (faltou '+(r.d-r.f)+')'));
    const best = rs.slice().sort((a,b)=>b.nv-a.nv||b.e-a.e)[0];
    return `<details class="war" ${w.id===ids[ids.length-1]?'open':''}>
      <summary>
        <div class="wnum"><div><small>GUERRA</small><b>${w.id}</b></div></div>
        <div class="wmeta"><div class="wopp"><span>contra</span> ${esc(w.opp)}</div>
          <div class="wtags"><span>${dataBR(w.data)}</span>·<span><b>${F}/${D}</b> ataques</span>·<span><b>${E}</b> estrelas</span>·<span><b>${NV}</b> novas</span></div></div>
        <div class="wright"><div class="wscore">${F===D?'Completa':(D-F)+' perdidos'}</div><span class="chev">Detalhes</span></div>
      </summary>
      <div class="wbody">
        <div class="hl">
          <div class="hlbox"><h4>Fizeram 6 estrelas</h4><p>${perf.length?perf.join(', '):'Ninguém'}</p></div>
          <div class="hlbox"><h4>Mais novas estrelas</h4><p>${best?esc(best.jogador)+' · '+best.nv:'–'}</p></div>
          <div class="hlbox"><h4>Ataques perdidos</h4><p style="color:${falt.length?'var(--bad)':'var(--ok)'}">${falt.length?falt.join(', '):'Nenhum. Todos atacaram!'}</p></div>
        </div>
        <div class="tbl"><table><thead><tr><th>#</th><th>Jogador</th><th class="n">Estrelas</th><th class="n">Novas</th><th class="n">Destruição</th><th class="n">Ataques</th></tr></thead><tbody>
          ${rs.map((r,i)=>`<tr><td class="rk">${i+1}</td><td class="name">${esc(r.jogador)}</td><td class="n"><b>${r.e}</b> <span class="star">★</span></td><td class="n">${r.nv}</td><td class="n">${r.f?fmt(r.p/r.f)+'%':'–'}</td><td class="n">${r.f}/${r.d} ${r.f<r.d?statusPill(r.f,r.d):''}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
    </details>`;
  }
})();

/* ---------- Última liga ---------- */
(function(){
  const rows = DATA.liga.map(r=>({nome:r.jogador, estrelas:num(r.estrelas), pct:num(r.destruicao_total_pct),
    feitos:num(r.ataques_feitos), disp:num(r.ataques_disponiveis), media:num(r.destruicao_media_pct)}));
  const cmp=(a,b)=>b.estrelas-a.estrelas||b.pct-a.pct;
  const escal = rows.filter(r=>r.disp>0);
  const totF = rows.reduce((s,r)=>s+r.feitos,0), totD = rows.reduce((s,r)=>s+r.disp,0);
  const perdidos = rows.filter(r=>r.disp>r.feitos);
  const top = (k,lab)=>'<ol>'+rows.slice().sort((a,b)=>b[k]-a[k]).slice(0,5).map((r,i)=>`<li><span><span class="medal">${i+1}</span>${esc(r.nome)}</span><span>${lab(r)}</span></li>`).join('')+'</ol>';
  $('#view-liga').innerHTML = `
  <section>
    <div><h2>Liga de Clãs de outubro</h2><p class="sec-sub">Resultado final, 7 rodadas.</p></div>
    <div class="stats">
      <div class="stat"><small>Escalados</small><b>${escal.length}</b></div>
      <div class="stat"><small>Estrelas</small><b>${rows.reduce((s,r)=>s+r.estrelas,0)}</b></div>
      <div class="stat"><small>Ataques usados</small><b>${totF}/${totD}</b><div class="meter"><i style="width:${100*totF/totD}%"></i></div></div>
      <div class="stat"><small>Ataques perdidos</small><b style="color:var(--bad)">${totD-totF}</b></div>
    </div>
    <div class="cols">
      <div class="box"><h3>Mais estrelas</h3>${top('estrelas',r=>r.estrelas+' <span class="star">★</span>')}</div>
      <div class="box"><h3>Maior destruição</h3>${top('pct',r=>r.pct+'%')}</div>
      <div class="box"><h3>Perderam ataques</h3><ul>${perdidos.map(r=>`<li><span>${esc(r.nome)}</span><span>${statusPill(r.feitos,r.disp)}</span></li>`).join('')}</ul></div>
    </div>
  </section>
  <section id="liga-tbl">
    <div class="sec-head"><h2>Ranking da liga</h2><div class="sort">Ordenar <button data-k="rank">Estrelas</button><button data-k="pct">Destruição</button><button data-k="media">Média</button></div></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>Jogador</th><th class="n">Estrelas</th><th class="n">Destruição total</th><th class="n">Média</th><th class="n">Ataques</th><th>Situação</th></tr></thead><tbody></tbody></table></div>
  </section>`;
  sortTable($('#liga-tbl'), rows, s=>s.map((r,i)=>`<tr class="${i<3?'top':''}"><td class="rk">${i+1}</td><td class="name">${esc(r.nome)}</td><td class="n"><b>${r.estrelas}</b> <span class="star">★</span></td><td class="n">${r.pct}%</td><td class="n">${r.media==null?'–':fmt(r.media)+'%<span class="bar"><i style="width:'+r.media+'%"></i></span>'}</td><td class="n">${r.feitos}/${r.disp}</td><td>${statusPill(r.feitos,r.disp)}</td></tr>`).join(''), 'rank', cmp);
})();

/* ---------- Abas ---------- */
function show(v){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v));
  $('#view-liga').hidden = v!=='liga'; $('#view-guerras').hidden = v!=='guerras';
}
$('.tabs').addEventListener('click', e=>{const b=e.target.closest('button'); if(b) show(b.dataset.v);});
show(location.hash.slice(1)==='liga' ? 'liga' : 'guerras');
